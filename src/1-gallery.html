<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.css" integrity="sha512-Vv8v6f4W8I6CjLpX6P5hG8O6k8fQ/9i/u/6W7r+3j3M/5g1p7/3W9+8r6v6m4Vv8v6f4W8I6CjLpX6P5hG8O6k8fQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            list-style: none;
            padding: 20px;
        }
        .gallery__image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <ul class="gallery"></ul>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.js" integrity="sha512-v/8v6f4W8I6CjLpX6P5hG8O6k8fQ/9i/u/6W7r+3j3M/5g1p7/3W9+8r6v6m4Vv8v6f4W8I6CjLpX6P5hG8O6k8fQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="1-gallery.js" type="module"></script>
</body>
</html>
